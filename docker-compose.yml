version: '3.8'

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: natstack-website
    ports:
      - "3000:3000"
    volumes:
      # Persist database data
      - ./website/data:/app/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

