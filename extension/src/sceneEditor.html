<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
    <title>Scene</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #gameide-runtime {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <iframe id="gameide-runtime" src="http://localhost:{{PORT}}"></iframe>
    <script>
      const runScript = () => {
        const iframe = document.getElementById("gameide-runtime");
        const vscode =
          typeof acquireVsCodeApi !== "undefined" ? acquireVsCodeApi() : null;
        let pendingSceneContent = null;
        let runtimeRequestedInitialScene = false;

        function postToVscode(payload) {
          vscode?.postMessage(payload);
        }
        function postToIframe(payload) {
          iframe?.contentWindow?.postMessage(payload, "*");
        }

        function sendInitialSceneToIframe(content) {
          postToIframe({
            type: "gameide.editor.initialScene",
            content: content,
          });
        }

        /** `event.data` or one optional VS Code `{ data: payload }` hop. */
        function typedWindowMessagePayload(raw) {
          var d = raw;
          if (d && typeof d === "object" && typeof d.type === "string") return d;
          if (
            d &&
            typeof d === "object" &&
            d.data &&
            typeof d.data === "object" &&
            typeof d.data.type === "string"
          )
            return d.data;
          return null;
        }

        iframe.addEventListener("load", function () {
          if (pendingSceneContent !== null) {
            sendInitialSceneToIframe(pendingSceneContent);
          }
        });

        window.addEventListener("message", function (event) {
          var message = typedWindowMessagePayload(event.data);
          if (!message || typeof message.type !== "string") return;

          var fromRuntimeIframe = event.source === iframe?.contentWindow;

          if (
            !fromRuntimeIframe &&
            message.type.indexOf("gameide.editor.") === 0
          ) {
            postToIframe(message);
            return;
          }

          if (fromRuntimeIframe) {
            switch (message.type) {
              case "gameide.editor.requestInitialScene":
                runtimeRequestedInitialScene = true;
                if (pendingSceneContent !== null)
                  sendInitialSceneToIframe(pendingSceneContent);
                else
                  postToVscode({
                    type: "gameide.editor.requestInitialScene",
                  });
                break;
              case "gameide.editor.scenePatch":
                if (message.content !== undefined)
                  postToVscode({
                    type: "gameide.editor.scenePatch",
                    content: message.content,
                  });
                break;
              case "gameide.editor.sceneChange":
                if (message.content !== undefined)
                  postToVscode({
                    type: "gameide.editor.sceneChange",
                    content: message.content,
                  });
                break;
            }
            return;
          }

          if (message.type === "scene" && message.content !== undefined) {
            pendingSceneContent = message.content;
            if (runtimeRequestedInitialScene)
              sendInitialSceneToIframe(message.content);
            if (message.stopAfter)
              postToIframe({ type: "gameide.editor.stop" });
          }
        });
      };
      runScript();
    </script>
  </body>
</html>
