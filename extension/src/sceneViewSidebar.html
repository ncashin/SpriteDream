<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      color: var(--vscode-foreground);
      background: var(--vscode-sideBar-background);
    }
    #root {
      background: var(--vscode-editorWidget-background);
      border: 1px solid var(--vscode-widget-border);
      border-radius: 3px;
      padding: 8px 4px 8px 8px;
      margin: 0;
    }
    .tree { padding-left: 0; list-style: none; margin: 0; }
    .tree ul {
      padding-left: 16px;
      list-style: none;
      border-left: 1px solid var(--vscode-widget-border);
      margin: 2px 0;
    }
    .row {
      display: flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 4px 2px 8px;
      margin: 1px 0;
      cursor: default;
      border-radius: 3px;
    }
    .row:hover { background: var(--vscode-list-hoverBackground); }
    .row.expandable { cursor: pointer; }
    .key { flex-shrink: 0; margin-right: 10px; color: var(--vscode-foreground); }
    .value {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--vscode-descriptionForeground);
      cursor: text;
    }
    .value:focus { outline: none; }
    .value.placeholder { color: var(--vscode-input-placeholderForeground, #6b6b6b); }
    .doc-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      margin: 8px 0 6px 0;
      padding: 2px 4px 2px 0;
      color: var(--vscode-foreground);
    }
    .doc-header:first-child { margin-top: 0; }
    .doc-name { flex: 1; min-width: 0; }
    .icon-btn {
      width: 12px;
      height: 12px;
      min-width: 12px;
      min-height: 12px;
      padding: 0;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--vscode-descriptionForeground);
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .icon-btn svg { display: block; width: 12px; height: 12px; }
    .row .icon-btn { opacity: 0; }
    .row:hover .icon-btn { opacity: 1; }
    .row-icon { margin-right: 4px; }
    .toggle { margin-left: auto; }
    .add-btn { margin-left: 2px; }
    .del-btn { margin-left: 2px; }
    .del-btn:hover { color: var(--vscode-errorForeground, #f14c4c); }
    .dropdown {
      position: absolute;
      z-index: 100;
      background: var(--vscode-dropdown-background);
      border: 1px solid var(--vscode-dropdown-border);
      border-radius: 3px;
      padding: 4px 0;
      min-width: 100px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .dropdown button {
      display: block;
      width: 100%;
      padding: 4px 12px;
      border: none;
      background: none;
      color: var(--vscode-foreground);
      text-align: left;
      cursor: pointer;
      font-size: inherit;
      font-family: inherit;
    }
    .dropdown button:hover { background: var(--vscode-list-hoverBackground); }
    .key[contenteditable="true"] { outline: none; background: var(--vscode-input-background); border-radius: 2px; padding: 0 2px; }
    .empty {
      color: var(--vscode-descriptionForeground);
      font-style: italic;
      padding: 12px 8px;
      margin: 0;
    }
  </style>
</head>
<body>
  {{LUCIDE_ICONS_SCRIPT}}
  <div id="root"></div>
  <script>
    (function () {
      const vscode = acquireVsCodeApi();
      const root = document.getElementById('root');

      function formatVal(v) {
        if (v === null) return 'null';
        if (typeof v === 'string') return JSON.stringify(v);
        return String(v);
      }

      function hasChildren(v) {
        return v !== null && typeof v === 'object';
      }

      function uniqueKey(obj) {
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return 'newKey';
        let key = 'newKey', i = 0;
        while (key in obj) key = 'newKey' + (++i);
        return key;
      }

      function requestUpdate() {
        setTimeout(function () { vscode.postMessage({ type: 'requestUpdate' }); }, 50);
      }

      const ADD_OPTIONS = [
        { label: 'String', value: '' },
        { label: 'Number', value: 0 },
        { label: 'Boolean', value: false },
        { label: 'Object', value: {} }
      ];

      function openAddMenu(path, value, uri, anchorEl) {
        const rect = anchorEl.getBoundingClientRect();
        const menu = document.createElement('div');
        menu.className = 'dropdown';
        menu.style.left = rect.left + 'px';
        menu.style.top = (rect.bottom + 2) + 'px';
        ADD_OPTIONS.forEach(function (opt) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = opt.label;
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            vscode.postMessage({
              type: 'addProperty',
              uri: String(uri),
              path: Array.isArray(path) ? path : [],
              key: uniqueKey(value),
              value: opt.value
            });
            requestUpdate();
            close();
          });
          menu.appendChild(btn);
        });
        function close() {
          menu.remove();
          document.removeEventListener('click', close);
        }
        document.body.appendChild(menu);
        document.addEventListener('click', close);
      }

      function makeRow(key, value, path, uri) {
        const row = document.createElement('div');
        row.className = 'row' + (hasChildren(value) ? ' expandable' : '');

        const keySpan = document.createElement('span');
        keySpan.className = 'key';
        keySpan.textContent = key;
        keySpan.title = 'Double-click to rename';
        keySpan.addEventListener('dblclick', function (e) {
          e.stopPropagation();
          keySpan.contentEditable = 'true';
          keySpan.focus();
          var sel = window.getSelection();
          if (sel) {
            var r = document.createRange();
            r.selectNodeContents(keySpan);
            sel.removeAllRanges();
            sel.addRange(r);
          }
        });
        keySpan.addEventListener('blur', function () {
          if (keySpan.contentEditable !== 'true') return;
          keySpan.contentEditable = 'false';
          var newKey = keySpan.textContent.trim();
          if (newKey && newKey !== key) {
            vscode.postMessage({ type: 'rename', uri: String(uri), path: path.slice(), newKey: newKey });
            requestUpdate();
          } else {
            keySpan.textContent = key;
          }
        });
        keySpan.addEventListener('keydown', function (e) {
          if (keySpan.contentEditable !== 'true') return;
          if (e.key === 'Enter') { e.preventDefault(); keySpan.blur(); }
          if (e.key === 'Escape') { keySpan.textContent = key; keySpan.contentEditable = 'false'; keySpan.blur(); }
        });
        keySpan.addEventListener('click', function (e) { e.stopPropagation(); });
        row.appendChild(keySpan);

        const valueSpan = document.createElement('span');
        valueSpan.className = 'value';
        if (hasChildren(value)) {
          valueSpan.textContent = Array.isArray(value) ? '[' + value.length + ']' : '';
          valueSpan.style.cursor = 'default';
        } else {
          var isPlaceholder = value === null;
          valueSpan.textContent = isPlaceholder ? '…' : formatVal(value);
          if (isPlaceholder) valueSpan.classList.add('placeholder');
          valueSpan.contentEditable = 'true';
          valueSpan.spellcheck = false;
          valueSpan.dataset.path = JSON.stringify(path);
          valueSpan.dataset.initial = isPlaceholder ? 'null' : formatVal(value);
          valueSpan.dataset.placeholder = isPlaceholder ? '1' : '';
          valueSpan.addEventListener('click', function (e) { e.stopPropagation(); });
          valueSpan.addEventListener('focus', function () {
            if (valueSpan.dataset.placeholder === '1') { valueSpan.textContent = ''; valueSpan.classList.remove('placeholder'); }
          });
          valueSpan.addEventListener('blur', function () {
            var raw = valueSpan.textContent.trim();
            var parsed = (raw === '' || valueSpan.dataset.placeholder === '1') ? null : (function () { try { return JSON.parse(raw); } catch (_) { return raw; } })();
            vscode.postMessage({ type: 'edit', uri: String(uri), path: path.slice(), value: parsed });
            requestUpdate();
            valueSpan.dataset.initial = parsed === null ? 'null' : formatVal(parsed);
            valueSpan.dataset.placeholder = parsed === null ? '1' : '';
            valueSpan.textContent = parsed === null ? '…' : formatVal(parsed);
            if (parsed === null) valueSpan.classList.add('placeholder'); else valueSpan.classList.remove('placeholder');
          });
          valueSpan.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); valueSpan.blur(); }
            if (e.key === 'Escape') {
              valueSpan.textContent = valueSpan.dataset.initial === 'null' ? '…' : valueSpan.dataset.initial;
              valueSpan.dataset.placeholder = valueSpan.dataset.initial === 'null' ? '1' : '';
              valueSpan.classList.toggle('placeholder', valueSpan.dataset.placeholder === '1');
              valueSpan.blur();
            }
          });
        }
        row.appendChild(valueSpan);

        var addBtn = document.createElement('button');
        addBtn.className = 'icon-btn add-btn';
        addBtn.type = 'button';
        addBtn.title = 'Add property';
        addBtn.setAttribute('aria-label', 'Add property');
        if (window.LUCIDE_ICONS && window.LUCIDE_ICONS.plus) addBtn.innerHTML = window.LUCIDE_ICONS.plus;
        else addBtn.textContent = '+';
        addBtn.addEventListener('click', function (e) { e.stopPropagation(); openAddMenu(path, value, uri, addBtn); });
        row.appendChild(addBtn);

        var delBtn = document.createElement('button');
        delBtn.className = 'icon-btn del-btn';
        delBtn.type = 'button';
        delBtn.title = 'Delete';
        delBtn.setAttribute('aria-label', 'Delete');
        if (window.LUCIDE_ICONS && window.LUCIDE_ICONS.trash) delBtn.innerHTML = window.LUCIDE_ICONS.trash;
        else delBtn.textContent = '×';
        delBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          vscode.postMessage({ type: 'edit', uri: String(uri), path: path.slice(), delete: true });
        });
        row.appendChild(delBtn);

        return { row: row, valueSpan: valueSpan, keySpan: keySpan };
      }

      function renderTree(container, value, path, uri, open) {
        if (Array.isArray(value)) {
          value.forEach(function (item, i) {
            var p = path.concat(String(i));
            var entry = makeRow(String(i), item, p, uri);
            if (hasChildren(item)) {
              var icon = document.createElement('span');
              icon.className = 'icon-btn row-icon';
              icon.setAttribute('aria-hidden', 'true');
              if (window.LUCIDE_ICONS && window.LUCIDE_ICONS.folder) icon.innerHTML = window.LUCIDE_ICONS.folder;
              entry.row.insertBefore(icon, entry.row.firstChild);
              var toggle = document.createElement('span');
              toggle.className = 'icon-btn toggle';
              if (window.LUCIDE_ICONS) toggle.innerHTML = open ? window.LUCIDE_ICONS.chevronDown : window.LUCIDE_ICONS.chevronRight;
              else toggle.textContent = open ? '▼' : '▶';
              entry.row.appendChild(toggle);
              var ul = document.createElement('ul');
              entry.row.addEventListener('click', function () {
                ul.hidden = !ul.hidden;
                if (window.LUCIDE_ICONS) toggle.innerHTML = ul.hidden ? window.LUCIDE_ICONS.chevronRight : window.LUCIDE_ICONS.chevronDown;
                else toggle.textContent = ul.hidden ? '▶' : '▼';
              });
              container.appendChild(entry.row);
              container.appendChild(ul);
              ul.hidden = !open;
              renderTree(ul, item, p, uri, true);
            } else {
              container.appendChild(entry.row);
            }
          });
          return;
        }
        if (value !== null && typeof value === 'object') {
          Object.keys(value).forEach(function (k) {
            var p = path.concat(k);
            var v = value[k];
            var entry = makeRow(k, v, p, uri);
            if (hasChildren(v)) {
              var icon = document.createElement('span');
              icon.className = 'icon-btn row-icon';
              icon.setAttribute('aria-hidden', 'true');
              if (window.LUCIDE_ICONS && window.LUCIDE_ICONS.folder) icon.innerHTML = window.LUCIDE_ICONS.folder;
              entry.row.insertBefore(icon, entry.row.firstChild);
              var toggle = document.createElement('span');
              toggle.className = 'icon-btn toggle';
              if (window.LUCIDE_ICONS) toggle.innerHTML = open ? window.LUCIDE_ICONS.chevronDown : window.LUCIDE_ICONS.chevronRight;
              else toggle.textContent = open ? '▼' : '▶';
              entry.row.appendChild(toggle);
              var ul = document.createElement('ul');
              entry.row.addEventListener('click', function () {
                ul.hidden = !ul.hidden;
                if (window.LUCIDE_ICONS) toggle.innerHTML = ul.hidden ? window.LUCIDE_ICONS.chevronRight : window.LUCIDE_ICONS.chevronDown;
                else toggle.textContent = ul.hidden ? '▶' : '▼';
              });
              container.appendChild(entry.row);
              container.appendChild(ul);
              ul.hidden = !open;
              renderTree(ul, v, p, uri, true);
            } else {
              container.appendChild(entry.row);
            }
          });
        }
      }

      function render(documents) {
        root.innerHTML = '';
        if (!documents || documents.length === 0) {
          root.innerHTML = '<div class="empty">Open a .scene file to view state.</div>';
          return;
        }
        documents.forEach(function (doc) {
          var data = doc.data || {};
          var header = document.createElement('div');
          header.className = 'doc-header';
          var nameEl = document.createElement('span');
          nameEl.className = 'doc-name';
          nameEl.textContent = doc.name;
          header.appendChild(nameEl);
          var addBtn = document.createElement('button');
          addBtn.className = 'icon-btn';
          addBtn.type = 'button';
          addBtn.title = 'Add property';
          addBtn.setAttribute('aria-label', 'Add property');
          if (window.LUCIDE_ICONS && window.LUCIDE_ICONS.plus) addBtn.innerHTML = window.LUCIDE_ICONS.plus;
          else addBtn.textContent = '+';
          addBtn.addEventListener('click', function (e) { e.stopPropagation(); openAddMenu([], data, doc.uri, addBtn); });
          header.appendChild(addBtn);
          root.appendChild(header);
          var ul = document.createElement('ul');
          ul.className = 'tree';
          root.appendChild(ul);
          renderTree(ul, data, [], doc.uri, true);
        });
      }

      window.addEventListener('message', function (e) {
        var msg = e.data;
        if (msg.type === 'update') render(msg.documents || []);
      });

      vscode.postMessage({ type: 'ready' });
    })();
  </script>
</body>
</html>
