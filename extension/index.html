<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src http://localhost:7777 ws://localhost:7777; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http://localhost:7777 ws://localhost:7777;">
    <title>GameIDE Runtime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { height: 100vh; overflow: hidden; }
        iframe { width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body>
    <iframe id="viteFrame" src="http://localhost:7777"></iframe>
    <script>
        const vscode = acquireVsCodeApi();
        const iframe = document.getElementById('viteFrame');
        const pendingFileRequests = new Map();
        let pendingScene = null;
        let isRuntimeReady = false;

        function sendSceneToRuntime(sceneMessage) {
            if (isRuntimeReady && iframe.contentWindow) {
                try {
                    iframe.contentWindow.postMessage(sceneMessage, '*');
                    pendingScene = null;
                } catch (e) {
                    pendingScene = sceneMessage;
                }
            } else {
                pendingScene = sceneMessage;
            }
        }

        window.addEventListener('message', event => {
            const message = event.data;
            const isFromIframe = event.source === iframe.contentWindow;
            
            if (isFromIframe) {
                if (message.command === 'runtimeReady') {
                    isRuntimeReady = true;
                    if (pendingScene) {
                        sendSceneToRuntime(pendingScene);
                    }
                } else if (message.type && message.requestId) {
                    pendingFileRequests.set(message.requestId, message.type);
                    vscode.postMessage(message);
                }
            } else {
                if (message.requestId && pendingFileRequests.has(message.requestId)) {
                    iframe.contentWindow.postMessage(message, '*');
                    pendingFileRequests.delete(message.requestId);
                } else if (message.command === 'openScene') {
                    const sceneMessage = { command: 'openScene', path: message.path, content: message.content };
                    sendSceneToRuntime(sceneMessage);
                } else if (message.command === 'updateScene') {
                    if (isRuntimeReady && iframe.contentWindow) {
                        iframe.contentWindow.postMessage({ command: 'updateScene', diff: message.diff }, '*');
                    }
                }
            }
        });
    </script>
</body>
</html>
