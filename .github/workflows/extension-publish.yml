name: Publish VS Code extension

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run compile -w extension

      - name: Publish extension to Marketplace
        run: cd extension && npx @vscode/vsce publish -p "${{ secrets.VSCE_PAT }}"
